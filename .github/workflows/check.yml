name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      # Evaluate every host and check without building architecture-specific
      # closures. Heavy VM and host builds stay local and explicit; this PR gate
      # catches invalid configurations while remaining portable and inexpensive.
      - name: Evaluate flake
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems --print-build-logs 2>&1 | tee /tmp/flake-check.log
          if grep -E 'evaluation warning:' /tmp/flake-check.log; then
            echo 'Evaluation warnings must be fixed (see log above).'
            exit 1
          fi
