name: Module contract eval

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: module-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run module contract checks
        run: bash tests/contracts/run.sh
